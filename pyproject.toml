[project]
name = "Bank-agent"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain[google-genai]>=1.3.10",
    "langgraph>=1.0.0",
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "streamlit>=1.60.0",
    "tavily-python>=0.7.27",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
